name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Sense els tests de contracte, com a deploy.yml: criden APIs externes
      # reals (EUMETSAT, GitHub, Open-Meteo, el worker...) i un servei lent o
      # un 403 des dels runners no diu res del commit. Ja es comproven cada dia
      # a api-health-check.yml.
      - name: Test
        run: npx vitest run --exclude "**/*api-contract.test.ts"
