name: Deploy to Cloudflare

on:
  push:
    branches: [main]

# Es publica a meteotoniai.com (wrangler.toml). GitHub Pages
# (tonitapias.github.io/meteoai) ja no rep res de main: hi queda l'última
# versió publicada fins que s'hi posi el pont de la mudança.
permissions:
  contents: read

# Permet només un desplegament alhora
concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Les mateixes comprovacions que ci.yml: si fallen, no es publica res.
      # (ci.yml corre en paral·lel i no bloqueja aquest workflow.)
      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Sense els tests de contracte: criden APIs externes reals i una caiguda
      # d'una font (DWD, IPMA...) no ha de bloquejar un desplegament. Ja es
      # comproven cada dia a api-health-check.yml.
      - name: Test
        run: npx vitest run --exclude "**/*api-contract.test.ts"

      - name: Build
        env:
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_API_WEATHER_BASE: ${{ secrets.VITE_API_WEATHER_BASE }}
          VITE_API_AQI_BASE: ${{ secrets.VITE_API_AQI_BASE }}
          VITE_API_GEOCODING: ${{ secrets.VITE_API_GEOCODING }}
          VITE_API_TIMEOUT: ${{ secrets.VITE_API_TIMEOUT }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: deploy --message "${{ github.sha }}"
