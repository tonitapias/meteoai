name: Deploy to Cloudflare

on:
  push:
    branches: [main]

# Es publica a meteotoniai.com (wrangler.toml). Mentre duri la mudança, la mateixa
# app (amb l'avís de l'adreça nova) també va a l'adreça antiga,
# tonitapias.github.io/meteoai, per als que la tenen instal·lada o hi arriben per
# un enllaç vell.
permissions:
  contents: read

# Permet només un desplegament alhora
concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Les mateixes comprovacions que ci.yml: si fallen, no es publica res.
      # (ci.yml corre en paral·lel i no bloqueja aquest workflow.)
      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Sense els tests de contracte: criden APIs externes reals i una caiguda
      # d'una font (DWD, IPMA...) no ha de bloquejar un desplegament. Ja es
      # comproven cada dia a api-health-check.yml.
      - name: Test
        run: npx vitest run --exclude "**/*api-contract.test.ts"

      - name: Build
        env:
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_API_WEATHER_BASE: ${{ secrets.VITE_API_WEATHER_BASE }}
          VITE_API_AQI_BASE: ${{ secrets.VITE_API_AQI_BASE }}
          VITE_API_GEOCODING: ${{ secrets.VITE_API_GEOCODING }}
          VITE_API_TIMEOUT: ${{ secrets.VITE_API_TIMEOUT }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: deploy --message "${{ github.sha }}"

      - name: Build (adreça antiga, /meteoai/)
        env:
          BASE_PATH: /meteoai/
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_API_WEATHER_BASE: ${{ secrets.VITE_API_WEATHER_BASE }}
          VITE_API_AQI_BASE: ${{ secrets.VITE_API_AQI_BASE }}
          VITE_API_GEOCODING: ${{ secrets.VITE_API_GEOCODING }}
          VITE_API_TIMEOUT: ${{ secrets.VITE_API_TIMEOUT }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build -- --outDir dist-github-pages

      - name: Upload artifact (adreça antiga)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist-github-pages

  github-pages:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
