name: Deploy to GitHub Pages

on:
  push:
    branches: [main]  # O 'master' si la teva branca principal es diu així

# Permisos necessaris per desplegar a Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet només un desplegament alhora
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Les mateixes comprovacions que ci.yml: si fallen, no es publica res.
      # (ci.yml corre en paral·lel i no bloqueja aquest workflow.)
      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Sense els tests de contracte: criden APIs externes reals i una caiguda
      # d'una font (DWD, IPMA...) no ha de bloquejar un desplegament. Ja es
      # comproven cada dia a api-health-check.yml.
      - name: Test
        run: npx vitest run --exclude "**/*api-contract.test.ts"

      - name: Build
        env:
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_API_WEATHER_BASE: ${{ secrets.VITE_API_WEATHER_BASE }}
          VITE_API_AQI_BASE: ${{ secrets.VITE_API_AQI_BASE }}
          VITE_API_GEOCODING: ${{ secrets.VITE_API_GEOCODING }}
          VITE_API_TIMEOUT: ${{ secrets.VITE_API_TIMEOUT }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5