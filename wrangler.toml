# Allotjament de l'app a Cloudflare: Workers amb fitxers estàtics, sense codi
# de servidor. Es publica el contingut de dist/ (npm run build) a meteotoniai.com.
name = "meteotoniai"
compatibility_date = "2026-08-25"

# Només el domini propi: ni *.workers.dev ni adreces de prova, que els workers
# de l'API (meteoai-proxy, meteo-sat-proxy) no accepten com a Origin.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"

[[routes]]
pattern = "meteotoniai.com"
custom_domain = true
